name: PowerShell quality

on:
  push:
    paths:
      - '**.ps1'
      - '**.psm1'
      - '**.psd1'
      - '**.cs'
      - 'tests/**'
      - 'locales/**'
      - 'config/**'
      - '.github/workflows/quality.yml'
  pull_request:
    paths:
      - '**.ps1'
      - '**.psm1'
      - '**.psd1'
      - '**.cs'
      - 'tests/**'
      - 'locales/**'
      - 'config/**'
      - '.github/workflows/quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remnexa-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install pinned PowerShell test tools
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force

      - name: Probe restricted Windows worker
        shell: pwsh
        run: |
          $probe = ./tools/Test-ClamAVWorkerHost.ps1 -OutputPath ./dist/ci-worker-host.json
          $probe | ConvertTo-Json -Depth 9 | Write-Host
          if (-not $probe.Passed) {
            $message = 'Stage=' + $probe.Stage + '; NativeError=' + $probe.Failure.NativeErrorCode + '; ' + $probe.Failure.Message
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Restricted worker host probe::$message"
            throw 'Restricted worker host probe failed.'
          }

      - name: Run Pester tests
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion -lt [version]'7.5') {
            throw "REMNEXA requires PowerShell 7.5 or newer; found $($PSVersionTable.PSVersion)."
          }
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = './tests'
          $configuration.Run.PassThru = $true
          $configuration.TestResult.Enabled = $true
          $configuration.TestResult.OutputPath = './dist/pester-results.xml'
          $result = Invoke-Pester -Configuration $configuration
          $result | Select-Object PassedCount,FailedCount,SkippedCount,TotalCount |
            ConvertTo-Json | Set-Content ./dist/ci-test-summary.json -Encoding utf8
          Write-Host "::notice title=Pester test totals::Passed=$($result.PassedCount); Failed=$($result.FailedCount); Skipped=$($result.SkippedCount); Total=$($result.TotalCount)"
          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) Pester test(s) failed."
          }

      - name: Run PSScriptAnalyzer error gate
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Force
          $files = Get-ChildItem -Path . -Recurse -File -Include *.ps1,*.psm1,*.psd1 |
            Where-Object { $_.FullName -notmatch '[\\/]Backup-[^\\/]+[\\/]|[\\/]runtime[\\/]|[\\/]ClamAV[\\/]' }
          $errors = @($files | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_.FullName -Severity Error
          })
          if ($errors.Count -gt 0) {
            $errors | Format-List -Property Path,Line,RuleName,Message | Out-String | Write-Host
            throw "$($errors.Count) PSScriptAnalyzer error(s) found."
          }

      - name: Build and verify source distribution
        shell: pwsh
        run: |
          try {
            $package = ./tools/New-RemnexaPackage.ps1 -Version '2.2.0'
            ./tools/Test-RemnexaPackage.ps1 -Path $package.Package -ExpectedSha256 $package.SHA256
          } catch {
            $message = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Source candidate validation::$message"
            git status --short
            throw
          }

      - name: Upload verified source candidate
        uses: actions/upload-artifact@v4
        with:
          name: REMNEXA-source-candidate
          path: dist/REMNEXA-2.2.0-source.zip*
          if-no-files-found: error

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: REMNEXA-validation
          path: |
            dist/ci-worker-host.json
            dist/pester-results.xml
            dist/ci-test-summary.json
          retention-days: 7
          if-no-files-found: warn
