name: PowerShell quality

on:
  push:
    paths:
      - '**.ps1'
      - '**.psm1'
      - '**.psd1'
      - 'tests/**'
      - 'locales/**'
      - 'config/**'
      - '.github/workflows/quality.yml'
  pull_request:
    paths:
      - '**.ps1'
      - '**.psm1'
      - '**.psd1'
      - 'tests/**'
      - 'locales/**'
      - 'config/**'
      - '.github/workflows/quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned PowerShell test tools
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force

      - name: Run Pester tests
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion -lt [version]'7.5') {
            throw "REMNEXA requires PowerShell 7.5 or newer; found $($PSVersionTable.PSVersion)."
          }
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          $result = Invoke-Pester -Path ./tests -CI -PassThru
          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) Pester test(s) failed."
          }

      - name: Run PSScriptAnalyzer error gate
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Force
          $files = Get-ChildItem -Path . -Recurse -File -Include *.ps1,*.psm1,*.psd1 |
            Where-Object { $_.FullName -notmatch '[\\/]Backup-[^\\/]+[\\/]|[\\/]runtime[\\/]|[\\/]ClamAV[\\/]' }
          $errors = @($files | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_.FullName -Severity Error
          })
          if ($errors.Count -gt 0) {
            $errors | Format-List -Property Path,Line,RuleName,Message | Out-String | Write-Host
            throw "$($errors.Count) PSScriptAnalyzer error(s) found."
          }

      - name: Build and verify source release candidate
        shell: pwsh
        run: |
          $package = ./tools/New-RemnexaPackage.ps1 -Version '2.2.0-rc.3'
          ./tools/Test-RemnexaPackage.ps1 -Path $package.Package -ExpectedSha256 $package.SHA256

      - name: Upload verified source candidate
        uses: actions/upload-artifact@v4
        with:
          name: REMNEXA-source-candidate
          path: dist/REMNEXA-2.2.0-rc.3-source.zip*
          if-no-files-found: error
